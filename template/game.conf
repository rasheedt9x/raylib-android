# raylib-android game (see the kit's NOTES.md). `kit.sh new` fills these in.
NAME=game               # APK file name
LABEL="Game"            # app name under the icon
PACKAGE=local.game      # Android package id; changing it makes a separate app
ORIENTATION=portrait    # portrait | landscape | sensorLandscape | fullSensor ...
DEV_PORT=47123          # hot reload server port (127.0.0.1); each game gets its own
